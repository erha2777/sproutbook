<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Sproutbook 四层结构">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8A7A68"/>
    </marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9B6BB3"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#FDFBF7"/>

  <!-- 渲染层 -->
  <rect x="70" y="60" width="560" height="104" rx="16" fill="#E9F4E2" stroke="#7FB069" stroke-width="1.6"/>
  <text x="350" y="105" text-anchor="middle" font-size="21" font-weight="600" fill="#2A1C10" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">渲染层 · React 19</text>
  <text x="350" y="135" text-anchor="middle" font-size="14" fill="#5C6B52" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">8 个页面 · 14 个组件 · theme.css</text>

  <!-- 契约层 -->
  <rect x="70" y="204" width="560" height="86" rx="16" fill="#FDF0DF" stroke="#E6A15C" stroke-width="1.6"/>
  <text x="350" y="241" text-anchor="middle" font-size="20" font-weight="600" fill="#2A1C10" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">契约层 · window.api</text>
  <text x="350" y="269" text-anchor="middle" font-size="14" fill="#8A6A45" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">shared/api.ts 类型契约 + preload 白名单</text>

  <!-- 主进程 -->
  <rect x="70" y="330" width="560" height="112" rx="16" fill="#E4EFF7" stroke="#5B8FB9" stroke-width="1.6"/>
  <text x="350" y="367" text-anchor="middle" font-size="20" font-weight="600" fill="#2A1C10" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">主进程 · Electron 41</text>
  <text x="350" y="397" text-anchor="middle" font-size="14" fill="#4A6B85" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">IPC 通道注册 · AI / 天气 / 图片服务</text>
  <text x="350" y="421" text-anchor="middle" font-size="14" fill="#4A6B85" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">db/ · services/ · ipc/index.ts</text>

  <!-- 存储 -->
  <rect x="70" y="482" width="560" height="80" rx="16" fill="#F2E8DA" stroke="#8B6F47" stroke-width="1.6"/>
  <text x="350" y="515" text-anchor="middle" font-size="20" font-weight="600" fill="#2A1C10" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">存储</text>
  <text x="350" y="543" text-anchor="middle" font-size="14" fill="#7A6244" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">SQLite（node:sqlite）· images/ · backups/</text>

  <!-- 主链路箭头 -->
  <line x1="350" y1="164" x2="350" y2="198" stroke="#8A7A68" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="350" y1="290" x2="350" y2="324" stroke="#8A7A68" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="350" y1="442" x2="350" y2="476" stroke="#8A7A68" stroke-width="2" marker-end="url(#ar)"/>

  <!-- core 侧栏 -->
  <rect x="690" y="60" width="200" height="382" rx="16" fill="#F7F1FA" stroke="#9B6BB3" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="790" y="106" text-anchor="middle" font-size="19" font-weight="600" fill="#6B4680" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">core/</text>
  <text x="790" y="132" text-anchor="middle" font-size="13" fill="#7D5C90" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">纯函数领域内核</text>
  <text x="790" y="178" text-anchor="middle" font-size="13" fill="#7D5C90" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">care · growth</text>
  <text x="790" y="202" text-anchor="middle" font-size="13" fill="#7D5C90" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">sprite · weather</text>
  <text x="790" y="226" text-anchor="middle" font-size="13" fill="#7D5C90" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">fieldTypes · types</text>
  <text x="790" y="272" text-anchor="middle" font-size="13" fill="#7D5C90" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">不 import electron</text>
  <text x="790" y="296" text-anchor="middle" font-size="13" fill="#7D5C90" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">不碰数据库与文件</text>
  <text x="790" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#6B4680" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">两端共用</text>
  <text x="790" y="376" text-anchor="middle" font-size="12" fill="#9B84AA" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">渲染层与主进程都能直接 import</text>

  <!-- core 虚线连接 -->
  <line x1="632" y1="112" x2="686" y2="112" stroke="#9B6BB3" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arp)"/>
  <line x1="632" y1="386" x2="686" y2="386" stroke="#9B6BB3" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arp)"/>
</svg>
