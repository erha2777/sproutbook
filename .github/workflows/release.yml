name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 打包 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 发布前必须通过自检 —— 有失败项就不要发出去
      - name: 数据层自检
        run: pnpm smoke

      - name: 构建
        run: pnpm build

      - name: 打包并发布到 Release
        # electron-builder.yml 里 publish 为 null，这里显式指定 GitHub 发布目标。
        # CI 中 actions/checkout 已配置好 git remote，因此能解析出仓库地址。
        #
        # ⚠️ 必须写**长选项** `--config.publish.provider=github`。
        # 短选项 `-c.publish.provider=github` 在 Windows 上会被 electron-builder
        # 当成「配置文件路径」，报：
        #   ENOENT: no such file or directory, open '...\.publish.provider=github'
        # 于是 Windows job 每次都在打包步骤 2 秒内退出 1（Linux/macOS 正常，
        # 因为只有 Windows 的 argv 会走到那条解析分支）。这个问题在本地
        # Windows 上 100% 复现，换成长选项后 `loaded configuration` 正常。
        run: pnpm exec electron-builder ${{ matrix.args }} --publish always --config.publish.provider=github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 未配置签名证书时，macOS 不做公证；签名相关告警可忽略
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 上传构件（便于排查失败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.yml
          if-no-files-found: ignore
