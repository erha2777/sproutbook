appId: com.sproutbook.app
productName: Sproutbook
copyright: Copyright © 2026 Sproutbook contributors

# 直接复用 pnpm 已经下载好的 Electron 运行时，而不是在打包时重新下载。
#
# 好处有三：
#   1. 打包完全离线可用，不受网络 / 代理 / 企业证书影响（本机就是因为 TLS 中间人
#      导致 electron-builder 自带的下载器校验失败）；
#   2. 打包用的 Electron 版本与开发时严格一致，避免「本地能跑、装完不一样」；
#   3. 省掉每次打包一次约 100MB 的重复下载。
# 该目录由 electron 的 postinstall 生成，包含完整的发行版文件。
electronDist: node_modules/electron/dist

directories:
  output: release
  buildResources: build

# 告诉 electron-builder：node_modules 不用你管。
# 本项目运行时依赖为空，全部代码已被 electron-vite 打包进 out/。
# 详见 build/before-build.cjs 里的注释（也顺带规避了 electron-builder 26
# 与 pnpm 11 输出格式不兼容导致的打包失败）。
beforeBuild: ./build/before-build.cjs

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/node_modules/**/{test,__tests__,tests,example,examples,docs,doc}/**'

# 用户数据一律放 userData，绝不打进安装包
asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Sproutbook

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.lifestyle
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

linux:
  target:
    - AppImage
  category: Utility
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

# 这里**刻意不配置 publish**。
#
# 原因：只要配置了发布目标，electron-builder 就会尝试生成自动更新元数据
# （latest.yml），而这一步需要知道仓库地址（从 .git/config 或 package.json 的
# repository 字段读取）。本地仓库可能还没配 remote，于是打包在最后一步失败 ——
# 安装包其实已经生成，但退出码是 1，很容易让人误判。
#
# 所以：本地打包只产出安装包；需要发布时由 CI 显式指定发布目标，见
# .github/workflows/release.yml 里的 `--publish always -c.publish.provider=github`。
# CI 中 actions/checkout 会配置好 git remote，因此能正常解析仓库地址。
publish: null
