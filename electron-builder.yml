appId: com.sproutbook.app
productName: Sproutbook
copyright: Copyright © 2026 Sproutbook contributors

# 直接复用 pnpm 已经下载好的 Electron 运行时，而不是在打包时重新下载。
#
# 好处有三：
#   1. 打包完全离线可用，不受网络 / 代理 / 企业证书影响（本机就是因为 TLS 中间人
#      导致 electron-builder 自带的下载器校验失败）；
#   2. 打包用的 Electron 版本与开发时严格一致，避免「本地能跑、装完不一样」；
#   3. 省掉每次打包一次约 100MB 的重复下载。
# 该目录由 electron 的 postinstall 生成，包含完整的发行版文件。
electronDist: node_modules/electron/dist

directories:
  output: release
  buildResources: build

# 告诉 electron-builder：node_modules 不用你管。
# 本项目运行时依赖为空，全部代码已被 electron-vite 打包进 out/。
# 详见 build/before-build.cjs 里的注释（也顺带规避了 electron-builder 26
# 与 pnpm 11 输出格式不兼容导致的打包失败）。
beforeBuild: ./build/before-build.cjs

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/node_modules/**/{test,__tests__,tests,example,examples,docs,doc}/**'

# 用户数据一律放 userData，绝不打进安装包
asar: true

win:
  # 应用图标：build/icon.ico（由 scripts/make-app-icon.py 生成，16~256 多尺寸）
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  # 兼容模式启动器：随应用一起放到 exe 同级目录。
  # 某些 Windows 环境下 Chromium 沙箱无法初始化，Electron 会在原生启动阶段
  # 直接崩溃（0x80000003），表现为「双击没反应」，且应用内部无法自救
  # （主进程 JS 根本没执行）。详见 README 的常见问题与该 .cmd 内的注释。
  extraFiles:
    - from: build/Sproutbook-compat.cmd
      to: Sproutbook-compat.cmd
    # 窗口图标：主进程从 exe 同级目录读它（asar 里的路径 nativeImage 读不稳）
    - from: build/icon.png
      to: icon.png
    # 图标文件也放一份：桌面快捷方式可以显式指向它。
    # 指向「另一个文件」能让 Windows 的图标缓存换一个 key ——
    # 否则快捷方式会一直显示创建时缓存下来的旧图标（Electron 的原子核）。
    - from: build/icon.ico
      to: icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Sproutbook
  # 额外创建一个带 --no-sandbox 的桌面快捷方式：
  # 受限环境（低完整性进程等）下 Chromium 沙箱无法初始化，普通快捷方式会直接崩溃，
  # 且应用内部无法自救（沙箱初始化早于主进程 JS，已实测确认）。
  # 这样至少保证用户装完就有一个能用的入口。详见 build/installer.nsh。
  include: build/installer.nsh

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.lifestyle
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Utility
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

# 这里**刻意不配置 publish**。
#
# 原因：只要配置了发布目标，electron-builder 就会尝试生成自动更新元数据
# （latest.yml），而这一步需要知道仓库地址（从 .git/config 或 package.json 的
# repository 字段读取）。本地仓库可能还没配 remote，于是打包在最后一步失败 ——
# 安装包其实已经生成，但退出码是 1，很容易让人误判。
#
# 所以：本地打包只产出安装包；需要发布时由 CI 显式指定发布目标，见
# .github/workflows/release.yml 里的 `--publish always -c.publish.provider=github`。
# CI 中 actions/checkout 会配置好 git remote，因此能正常解析仓库地址。
publish: null
